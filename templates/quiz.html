<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Test your BYD technical knowledge with 5 random bilingual questions. Cuestionario tecnico BYD bilingue con 5 preguntas aleatorias.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Open Graph -->
  <meta property="og:title" content="BYD Tech Quiz">
  <meta property="og:description" content="5 random questions -- test your BYD technical knowledge">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">

  <!-- Favicon (inline SVG gear emoji) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">

  <title>BYD Tech Quiz | {{ langs[lang] }}</title>

  <!-- Font preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>

<div class="container page-in">

  <!-- Header -->
  <div class="page-header">
    <h1 id="title">⚙️ BYD Tech Quiz</h1>
    <p class="subtitle" id="subtitle">5 random questions -- test your BYD technical knowledge</p>
    <div class="header-row">
      <button class="btn btn-lang" onclick="switchLang()" id="langBtn">ES</button>
      <span class="score-pill" id="scoreDisplay" style="display:none"></span>
    </div>
  </div>

  <!-- Score Hero -->
  <div class="score-hero" id="scoreHero">
    <div class="big-score" id="scoreHeroValue"></div>
    <div class="score-label" id="scoreHeroLabel"></div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar-wrap" id="progressWrap" style="display:none">
    <div class="progress-stats">
      <span id="progressLabel">Answered 0/5</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <!-- Start Screen -->
  <div id="startScreen" class="start-screen">
    <div class="start-icon">⚙️</div>
    <h2 id="startTitle">BYD Tech Quiz</h2>
    <p class="start-subtitle" id="startSubtitle">Test your BYD technical knowledge with 5 random questions.</p>
    <button class="btn-start" onclick="startQuiz()" id="startBtn">Start Quiz</button>
  </div>

  <!-- Loading -->
  <div id="loading" class="loading-state" style="display:none">
    <div class="loading-spinner"></div>
    <div id="loadingText">Loading questions...</div>
  </div>

  <!-- Quiz Area -->
  <div id="quizArea" style="display:none">
    <div id="questionsContainer"></div>
    <div class="submit-row">
      <button class="btn btn-submit" onclick="checkAnswers()" id="submitBtn">✓ Check Answers</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="resultScreen" style="display:none">
    <div class="result-review" id="resultReview"></div>
    <div class="submit-row">
      <button class="btn btn-try-again" onclick="tryAgain()" id="tryAgainBtn">Try Again</button>
    </div>
  </div>

</div>

<script src="/static/quiz.js?v=3"></script>
</body>
</html>
